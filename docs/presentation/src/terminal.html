<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0b0e14; }
  .win { margin: 16px; border-radius: 12px; overflow: hidden; background: #11151d;
         border: 1px solid #262d3b; box-shadow: 0 18px 40px rgba(0,0,0,0.45); }
  .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
         background: #1a202b; border-bottom: 1px solid #262d3b;
         font: 600 13px "Segoe UI", system-ui, sans-serif; color: #9aa6b8; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3a4252; }
  .bar .t { margin-left: 8px; }
  pre { margin: 0; padding: 14px 18px 18px; font: 14.5px/22px "Cascadia Mono", "Cascadia Code", Consolas, monospace;
        color: #d6dde8; white-space: pre; }
  .ok { color: #5fd38d; } .warn { color: #f2c94c; } .fail { color: #ff6b6b; font-weight: 700; }
  .pass { color: #5fd38d; font-weight: 700; } .dim { color: #7d889b; } .in { color: #ffffff; font-weight: 700; }
  .head { color: #ff8a4c; font-weight: 700; } .num { color: #7cc4ff; } .rec { color: #ff8a4c; }
  .title { color: #ffffff; font-weight: 700; }
</style></head>
<body><div class="win"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="t">{{TITLE}}</span></div><pre>{{BODY}}</pre></div></body></html>
